name: BLE to MQTT Gateway Pipeline
concurrency:
    group: ${{ github.head_ref || github.ref }}
    cancel-in-progress: true
on:
    push:
        branches:
            - "main"
        tags:
            - "v*.*.*"
    pull_request:
        branches:
            - "main"
jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Install dependencies
              run: npm ci --audit false

            - name: Typecheck
              run: npm run typecheck

            # The Effect-patched oxlint has no Linux musl build, so checks run here instead of in the Alpine image.
            - name: Lint
              run: npm run lint

            - name: Test
              run: npm run test

    pipeline:
        needs: checks
        env:
            PLATFORMS: linux/arm/v7${{ github.event_name != 'pull_request' && ', linux/arm64, linux/amd64' || '' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: lordthorzonus/ble2mqtt-gateway
                  tags: |
                      type=edge, branch=main
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}

            - name: Set up QEMU
              id: qemu
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              with:
                  platforms: linux/amd64,linux/arm64,linux/arm/v7

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Login to DockerHub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: ${{ env.PLATFORMS }}
                  target: production
                  builder: ${{ steps.buildx.outputs.name }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
